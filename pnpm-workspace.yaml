packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - esbuild
  - msgpackr-extract
allowBuilds:
  esbuild: true
  msgpackr-extract: true
  protobufjs: false
minimumReleaseAgeExclude:
